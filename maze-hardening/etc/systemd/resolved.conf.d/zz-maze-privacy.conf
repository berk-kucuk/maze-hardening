# Maze Linux (maze-hardening) — do not announce this machine on the LAN.
#
# systemd-resolved's compiled-in defaults are MulticastDNS=yes and LLMNR=yes:
# the machine answers mDNS (udp/5353) and LLMNR (udp/5355) queries and
# broadcasts its hostname to every network it joins. A privacy desktop should
# be silent by default; maze-guard's stealth layer hides the hostname while
# these two protocols would keep shouting it.
#
# Named zz- so it also wins over archiso's live-medium drop-in (MulticastDNS=yes)
# in the live session; the installer removes that drop-in anyway.
#
# Admin-tunable (pacman keeps local edits, new versions arrive as .pacnew).
# To get LAN name resolution back for one connection, prefer NetworkManager's
# per-connection setting (connection.mdns / connection.llmnr) over flipping
# the global default here.
[Resolve]
MulticastDNS=no
LLMNR=no
