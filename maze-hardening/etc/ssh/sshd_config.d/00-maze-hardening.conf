# Maze Linux SSH defaults: hardened, but password login stays ENABLED
# (key-based auth isn't practical for every user). Root login is still disabled.
# sshd itself is disabled on installed systems; this only matters once a user
# turns it on. To allow keys only:
#   echo 'PasswordAuthentication no' | sudo tee /etc/ssh/sshd_config.d/00-a-keys-only.conf
# (sshd keeps the FIRST value it reads for each keyword, so the override has
# to sort before this file — hence "00-a-".)
PermitRootLogin no
PasswordAuthentication yes
PubkeyAuthentication yes
# One password prompt path, not two: keyboard-interactive is a second way to
# ask for the same password, with its own PAM conversation to get wrong.
KbdInteractiveAuthentication no
# Never an account without a password — the Maze Ghost guest account has
# none by design. sshd refuses empty passwords by default; said here so a
# later "PermitEmptyPasswords yes" elsewhere cannot quietly change it, and the
# guest account is refused by name as well.
PermitEmptyPasswords no
DenyUsers ghost
X11Forwarding no
MaxAuthTries 3
AllowAgentForwarding no
AllowTcpForwarding no
# Extra hardening (lynis SSH-7408) — only matters if the user enables sshd (it is
# disabled by default on installed systems).
MaxSessions 2
LoginGraceTime 30
ClientAliveCountMax 2
LogLevel VERBOSE
TCPKeepAlive no
