# Maze Linux — kernel & network hardening defaults.
# Conservative settings that improve the security posture without breaking
# normal desktop use. Applied automatically by systemd-sysctl from /etc/sysctl.d.

## --- Kernel ---------------------------------------------------------------
# Hide kernel pointers from unprivileged users (defeats some exploit techniques).
kernel.kptr_restrict = 2
# Only root may read the kernel ring buffer (dmesg).
kernel.dmesg_restrict = 1
# Restrict ptrace to child processes only (YAMA) — blocks process snooping.
kernel.yama.ptrace_scope = 1
# Restrict eBPF to privileged users and harden the JIT.
kernel.unprivileged_bpf_disabled = 1
net.core.bpf_jit_harden = 2
# Disallow loading a new kernel via kexec at runtime.
kernel.kexec_load_disabled = 1
# (With kexec disabled outright, kernel.kexec_load_limit_* would add nothing.)
# Limit the Magic SysRq key to the safe "secure attention key" subset.
kernel.sysrq = 4
# Don't auto-load TTY line disciplines (shrinks kernel attack surface).
dev.tty.ldisc_autoload = 0
# A program may not type into the terminal that started it (TIOCSTI): the
# classic way out of a sandboxed or su'd shell. Arch's own kernel already
# builds with it off; this keeps it off on any other kernel.
dev.tty.legacy_tiocsti = 0
# No hardware/performance counters for unprivileged users (side channels and
# a long list of kernel bugs). 3 where the kernel knows it, otherwise as 2.
kernel.perf_event_paranoid = 3
# userfaultfd only from kernel-mode faults for unprivileged users: it is how
# many kernel race exploits hold the kernel still at the right moment.
vm.unprivileged_userfaultfd = 0
# io_uring for privileged processes only. It has been the source of a large
# share of recent kernel exploits (Google turned it off on ChromeOS, Android
# and its servers). Programs that use it — libuv in Node/Electron apps,
# databases — fall back to ordinary I/O when it is refused, as they do under
# Docker's default profile, which blocks it outright. To allow it again:
#   echo 'kernel.io_uring_disabled = 0' | sudo tee /etc/sysctl.d/99-zz-io-uring.conf
kernel.io_uring_disabled = 1
# Faster, more useful core-dump-free behaviour for setuid programs.
fs.suid_dumpable = 0
# Harden hardlink/symlink handling in world-writable dirs.
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2

## --- Network --------------------------------------------------------------
# Reverse-path filtering (anti-spoofing) in LOOSE mode: a packet is accepted if
# its source is reachable via any interface, not only the one it arrived on.
# This still drops spoofed / unroutable sources but tolerates the asymmetric
# routing used by VPNs (WireGuard/Mullvad), containers (Docker/Podman) and
# multi-homed hosts — strict mode (1) would silently drop their legit traffic.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2
# SYN cookies (basic SYN-flood protection).
net.ipv4.tcp_syncookies = 1
# Drop RST for connections in TIME-WAIT instead of ending them early
# (RFC 1337 "TIME-WAIT assassination").
net.ipv4.tcp_rfc1337 = 1
# Ignore ICMP redirects (prevents routing-table tampering).
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv4.conf.default.secure_redirects = 0
# Don't act as a router (no redirect sending).
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0
# Reject source-routed packets.
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0
# Ignore ICMP echo broadcasts (smurf-attack mitigation) and bogus responses.
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
# Log martian (impossible-address) packets.
net.ipv4.conf.all.log_martians = 1
net.ipv4.conf.default.log_martians = 1
# IPv6 privacy extensions (RFC 4941): use short-lived random addresses for
# outgoing connections, so the address websites see cannot follow this machine
# across networks and days. NetworkManager uses this value for every connection
# that does not set ipv6.ip6-privacy itself (the default). Same setting Ubuntu,
# Windows and macOS ship. The stable address is still assigned for incoming use.
net.ipv6.conf.all.use_tempaddr = 2
net.ipv6.conf.default.use_tempaddr = 2

# Deliberately NOT set: kernel.unprivileged_userns_clone / user.max_user_namespaces.
# Maze Glovebox, Maze Capsule and Flatpak/browsers build their sandboxes from
# unprivileged user namespaces; turning them off would take those sandboxes
# away, which costs more than the kernel attack surface it closes.
