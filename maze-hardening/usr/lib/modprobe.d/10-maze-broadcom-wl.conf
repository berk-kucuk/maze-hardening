# Maze Linux (maze-hardening) — never let udev auto-load the proprietary
# Broadcom `wl` driver by alias.
#
# broadcom-wl-dkms ships on every Maze system so that Broadcom laptops work
# out of the box. But wl.ko carries the alias
#
#     pci:v*d*sv*sd*bc02sc80i*
#
# i.e. ANY PCI vendor, ANY device, class 02/80 ("network controller, other").
# Intel CNVi and most other WiFi cards are in that class, so on a machine with
# no Broadcom hardware at all udev still loads wl at every boot. The module is
# unsigned and proprietary (taints the kernel P/O/E), and its init path trips
#
#     WARNING: arch/x86/kernel/cpu/bugs.c: Unpatched return thunk in use.
#
# which disables the retbleed/SRSO return-thunk mitigation for the WHOLE
# kernel — on a hardened desktop, for a card that is not even there.
#
# `blacklist` only stops alias-driven autoloading. The udev rule shipped next
# to this file (80-maze-broadcom-wl.rules) runs an explicit `modprobe wl` when
# a Broadcom (vendor 14e4) network controller is actually present, so Broadcom
# users see no change. A manual `modprobe wl` keeps working too.
blacklist wl
